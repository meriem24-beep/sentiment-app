name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # tout l'historique : git shortlog compte les deux auteurs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Outils de qualité (TP4)
        run: python -m venv .venv && . .venv/bin/activate && python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: ruff
        run: . .venv/bin/activate && ruff check .
      - name: mypy
        run: . .venv/bin/activate && mypy api
      - name: Entraîner le modèle
        run: . .venv/bin/activate && python src/train.py
      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
